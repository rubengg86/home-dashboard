<ion-content class="ion-padding" [fullscreen]="true">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><ion-icon name="flash" aria-hidden="true"></ion-icon></div>
      <h1>Home</h1>
      <p>Sign in with your dashboard account</p>
    </div>

    <form (ngSubmit)="submit()" novalidate>
      <ion-input label="Username" labelPlacement="floating" fill="outline" name="username" autocomplete="username"
                 autocapitalize="off" [(ngModel)]="username" required></ion-input>
      <ion-input label="Password" labelPlacement="floating" fill="outline" type="password" name="password"
                 autocomplete="current-password" [(ngModel)]="password" required>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      @if (showServer()) {
        <ion-input label="Server address" labelPlacement="floating" fill="outline" name="server" inputmode="url"
                   autocapitalize="off" helperText="Where the dashboard runs, e.g. https://home.ruben.gg"
                   [(ngModel)]="server" required></ion-input>
      }

      @if (error()) {
        <ion-text color="danger"><p class="error" role="alert">{{ error() }}</p></ion-text>
      }

      <ion-button expand="block" type="submit" [disabled]="busy() || !username || !password">
        @if (busy()) { <ion-spinner name="crescent"></ion-spinner> } @else { Sign in }
      </ion-button>
    </form>

    @if (!showServer()) {
      <button class="server" type="button" (click)="showServer.set(true)">
        <ion-icon name="server-outline" aria-hidden="true"></ion-icon> {{ server }}
      </button>
    }
  </div>
</ion-content>
