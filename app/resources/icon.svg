             C 544 640 624 672 694 650
             C 754 630 769 565 744 510
             C 704 430 604 400 512 430 Z" fill="#8e837c"/>

    <!-- white blaze up the forehead -->
    <path d="M 512 640 L 472 470 Q 512 300 552 470 Z" fill="#f5efe8"/>

    <!-- muzzle + chin -->
