      <path d="M 360 680 Q 260 660 180 622"/>
      <path d="M 360 712 Q 255 710 170 700"/>
      <path d="M 364 744 Q 265 764 190 782"/>
      <path d="M 664 680 Q 764 660 844 622"/>
      <path d="M 664 712 Q 769 710 854 700"/>
      <path d="M 660 744 Q 759 764 834 782"/>
