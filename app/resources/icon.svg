    <!-- eyes -->
    <circle cx="385" cy="545" r="74" fill="#2a2620"/>
    <circle cx="639" cy="545" r="74" fill="#2a2620"/>
    <circle cx="385" cy="545" r="66" fill="#b9c23f"/>
    <circle cx="639" cy="545" r="66" fill="#b9c23f"/>
    <circle cx="385" cy="548" r="28" fill="#1c1a14"/>
    <circle cx="639" cy="548" r="28" fill="#1c1a14"/>
    <circle cx="403" cy="528" r="11" fill="#ffffff"/>
    <circle cx="657" cy="528" r="11" fill="#ffffff"/>

    <!-- nose + mouth -->
    <path d="M 482 668 L 542 668 Q 552 672 540 692 L 520 712 Q 512 719 504 712 L 484 692 Q 472 672 482 668 Z" fill="#e59aa0"/>
    <path d="M 512 716 L 512 740 M 512 740 Q 482 772 452 746 M 512 740 Q 542 772 572 746"
