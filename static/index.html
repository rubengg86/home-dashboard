<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  :root {
    --bg: #f3f2ee; --card: #ffffff; --card-2: #f8f7f4; --ink: #1c1c1a; --muted: #75736d; --line: #e3e1db;
    --on: #f0a412; --on-ink: #1c1c1a; --on-soft: #fdf0d5; --ok: #2c9a5d; --bad: #d1453a; --accent: #2f62d8;
    --radius: 16px; --shadow: 0 1px 2px rgba(20, 20, 18, .04), 0 2px 8px rgba(20, 20, 18, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --card: #1c1c1a; --card-2: #232321; --ink: #efeee8; --muted: #95938c; --line: #2c2c29;
            --on-soft: #382b0f; --shadow: none; }
    .tile.on .chip { background: rgba(0, 0, 0, .25); }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  /* ---------- header */
  header { max-width: 1400px; margin: 0 auto; padding: 22px 24px 6px; display: flex; flex-wrap: wrap; gap: 12px;
           align-items: center; justify-content: space-between; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; font-weight: 700; }
  .sub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.live { background: var(--ok); }
  .actions { display: flex; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 999px;
         font-size: 14px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---------- layout */
  main { max-width: 1400px; margin: 0 auto; padding: 4px 24px 48px; display: grid;
         grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: 28px; align-items: start; }
  .side { position: sticky; top: 16px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } .side { position: static; } }
  @media (max-width: 520px) { header, main { padding-left: 16px; padding-right: 16px; } }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650;
       margin: 22px 0 10px; display: flex; align-items: baseline; gap: 8px; }
  h2 .count { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  @media (min-width: 700px) { .wide { grid-column: span 2; } }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }

  /* ---------- tiles (lights, plugs, hub children) */
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
          display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); min-width: 0;
          transition: background .2s, border-color .2s, box-shadow .3s; }
  .tile.click { cursor: pointer; user-select: none; }
  .tile.on { background: var(--on-soft); border-color: var(--on); }
  .tile.offline { opacity: .5; }
  .tile .top { display: flex; align-items: center; justify-content: space-between; }
  .ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--card-2); color: var(--muted); flex: none; }
  .ico svg { width: 20px; height: 20px; }
  .tile.on .ico { background: var(--on); color: var(--on-ink); }
  .name { font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12.5px; color: var(--muted); }
  .switch { position: relative; width: 42px; height: 25px; flex: none; border: 0; border-radius: 999px;
            background: var(--line); cursor: pointer; transition: background .2s; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px;
                   border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px #0003; }
  .switch.on { background: var(--on); }
  .switch.on::after { transform: translateX(17px); }
  .switch:disabled { cursor: default; opacity: .5; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 6px 0 2px;
                      border-radius: 999px; background: linear-gradient(var(--on), var(--on)) 0 / var(--v, 50%) 100% no-repeat, var(--line); cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
                      background: #fff; border: 0; box-shadow: 0 1px 3px #0004; }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 3px #0004; }
  input[type=range]:disabled { cursor: default; opacity: .5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; background: var(--card-2); border-radius: 7px; padding: 3px 8px; color: var(--muted); }
  .tile.on .chip { background: rgba(255, 255, 255, .55); }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.bad, .chip.bad b { color: var(--bad); }
  .err { font-size: 12px; color: var(--bad); }
  .glow { box-shadow: 0 0 0 3px var(--accent); }

  .hub { background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) + 4px); padding: 14px; box-shadow: var(--shadow); }
  .hub > .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .hub .tile { background: var(--card-2); box-shadow: none; }
  .hub .tile.on { background: var(--on-soft); }

  /* ---------- appliances */
  .state { font-size: 12px; font-weight: 650; padding: 3px 10px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; }
  .appl.running .state { background: var(--on); color: var(--on-ink); }
  .appl.ready .state { background: var(--ok); color: #fff; }
  .appl.paused .state { background: var(--line); color: var(--ink); }
  .big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .bar { height: 6px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--on); border-radius: 999px; transition: width .4s; }
  .boosts { display: flex; gap: 6px; flex-wrap: wrap; }
  .boosts .btn { padding: 6px 12px; font-size: 13px; box-shadow: none; }
  .connect { display: flex; gap: 8px; flex-wrap: wrap; }
  .connect input { flex: 1; min-width: 200px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
                   background: var(--card-2); color: var(--ink); font: inherit; font-size: 14px; }

  /* ---------- cameras (right column) */
  .cams { display: flex; flex-direction: column; gap: 14px; }
  .cam { position: relative; border-radius: var(--radius); overflow: hidden; background: #000; aspect-ratio: 16 / 9;
         cursor: zoom-in; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam .over { position: absolute; inset: auto 0 0 0; padding: 26px 12px 10px; color: #fff;
               background: linear-gradient(transparent, #000a); display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .cam .over .name { text-shadow: 0 1px 2px #0008; }
  .pill { font-size: 11px; color: #fff; background: #0009; padding: 3px 8px; border-radius: 999px;
          display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .cam .pill { position: absolute; top: 10px; left: 10px; }
  .cam .play { font-size: 12px; opacity: .85; white-space: nowrap; }
  .cam .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; font-size: 13px; padding: 12px; text-align: center; }

  /* ---------- live viewer */
  #viewer { position: fixed; inset: 0; background: #000e; display: grid; place-items: center; z-index: 10; padding: 16px; }
  .vbox { width: min(1280px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .vbar { display: flex; align-items: center; gap: 10px; color: #fff; flex-wrap: wrap; }
  .vbtn { background: #fff2; color: #fff; border: 0; border-radius: 8px; padding: 6px 11px; font-size: 13px; cursor: pointer; }
  .vbtn:hover { background: #fff3; }
  .vbtn.active { background: #fff; color: #000; }
  .vstage { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
  .vstage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .vnote { color: #bbb; font-size: 12.5px; }
  .vnote code { user-select: all; }

  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="greeting">Home</h1>
    <div class="sub"><span id="dot" class="dot"></span><span id="status">Connecting…</span><span>·</span><span id="clock"></span></div>
  </div>
  <div class="actions">
    <button class="btn" id="rediscover" title="Search the network for new devices">Rediscover</button>
    <button class="btn primary" id="alloff">All off</button>
  </div>
</header>

<main>
  <div>
    <section id="appliances" hidden>
      <h2>Appliances <span class="count" id="appauth"></span></h2>
      <div class="tile" id="stconnect" hidden style="margin-bottom:12px">
        <div class="name">Connect SmartThings</div>
        <div class="meta">Open the SmartThings login and allow access. You'll land on a page whose address contains <code>code=…</code>. Paste that whole address here and press Connect. You only do this once; the login renews itself.</div>
        <div class="connect">
          <button class="btn" id="stlogin">Open SmartThings login</button>
          <input id="stcode" placeholder="Paste the address (or just the code)">
          <button class="btn primary" id="stsubmit">Connect</button>
        </div>
      </div>
      <div class="grid"><div id="tuyacards" style="display:contents"></div><div id="stcards" style="display:contents"></div></div>
      <div class="err" id="apperr" hidden style="margin-top:8px"></div>
    </section>
    <section id="devices"><div class="empty">Looking for devices…</div></section>
  </div>

  <aside class="side">
    <section id="cameras" hidden>
      <h2>Cameras</h2>
      <div class="cams" id="camgrid"></div>
    </section>
  </aside>
</main>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Live camera">
  <div class="vbox">
    <div class="vbar">
      <span class="name" id="viewercap"></span>
      <span class="pill" id="vbadge"><span class="dot"></span><span id="vstate">connecting</span></span>
      <span style="flex:1"></span>
      <button class="vbtn" data-q="hd">HD</button>
      <button class="vbtn" data-q="sd">SD</button>
      <button class="vbtn" id="vclose" aria-label="Close">✕</button>
    </div>
    <div class="vstage">
      <img id="viewersnap" alt="">
      <img id="viewerlive" alt="" hidden>
    </div>
    <div class="vnote" id="vnote"></div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hhmm = (d) => new Date(d).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800);
}
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); }
  return r.json();
}

// ---------------------------------------------------------------- header clock
function tickClock() {
  const now = new Date(), h = now.getHours();
  $("#greeting").textContent = h < 12 ? "Good morning" : h < 19 ? "Good afternoon" : "Good evening";
  $("#clock").textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" }) + " · " + hhmm(now);
}
tickClock(); setInterval(tickClock, 15000);

// ---------------------------------------------------------------- icons
const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  bulb: svg('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>'),
  plug: svg('<path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8z"/><path d="M12 17v4"/>'),
  button: svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>'),
  sensor: svg('<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>'),
  hub: svg('<rect x="4" y="9" width="16" height="10" rx="3"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/><circle cx="12" cy="14" r="1.2"/>'),
  heater: svg('<path d="M12 3c2 3 4 4.5 4 8a4 4 0 0 1-8 0c0-2 1-3 1.5-4.5C10.5 8 12 6 12 3z"/><path d="M5 21h14"/>'),
  washer: svg('<rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="13" r="4.5"/><path d="M8 6.5h.01M11 6.5h2"/>'),
  dryer: svg('<rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="13" r="4.5"/><path d="M10.5 11.5c1 1 2 1 3 0M10.5 14.5c1 1 2 1 3 0"/>'),
};
function iconFor(d) {
  const m = (d.model || "").toUpperCase();
  if (m.startsWith("S200")) return ICONS.button;
  if (d.type === "hub") return ICONS.hub;
  if (d.type === "sensor" || m.startsWith("T3")) return ICONS.sensor;
  if (d.type && /bulb|light|strip|dimmer/.test(d.type)) return ICONS.bulb;
  return ICONS.plug;
}

// ---------------------------------------------------------------- Tapo devices
let devices = [];
const lastEvent = {};  // device id -> latest event (button presses etc.)
let dragging = null;   // slider being dragged: don't re-render under the user's finger
const EVENT_LABEL = { singleClick: "Single press", doubleClick: "Double press", rotation: "Rotated",
                      started: "Cycle started", finished: "Cycle finished", heating: "Heating",
                      hot_water_ready: "Hot water ready", safety_off: "Safety off" };
const fmtVal = (v, unit) => typeof v === "boolean" ? (v ? "yes" : "no") : unit ? `${v} ${unit}` : v;

function tile(d, parentOnline = true) {
  const online = d.online && parentOnline;
  const chips = d.sensors.map((s) => `<span class="chip">${esc(s.name)} <b>${esc(fmtVal(s.value, s.unit))}</b></span>`).join("");
  const ev = lastEvent[d.id];
  const status = d.switchable ? (d.on ? (d.dimmable && d.brightness != null ? `On · ${d.brightness}%` : "On") : "Off")
               : ev ? `${EVENT_LABEL[ev.event] || ev.event} · ${hhmm(ev.received || Date.now())}` : esc(d.model);
  return `
  <div class="tile ${d.on ? "on" : ""} ${online ? "" : "offline"} ${d.switchable && online ? "click" : ""}" data-id="${esc(d.id)}" ${d.switchable && online ? 'data-act="toggle"' : ""}>
    <div class="top">
      <span class="ico">${iconFor(d)}</span>
      ${d.switchable ? `<button class="switch ${d.on ? "on" : ""}" data-act="toggle" aria-label="Toggle ${esc(d.alias)}" ${online ? "" : "disabled"}></button>` : ""}
    </div>
    <div style="min-width:0">
      <div class="name" title="${esc(d.alias)}">${esc(d.alias)}</div>
      <div class="meta">${online ? status : "Offline"}</div>
    </div>
    ${d.dimmable ? `<input type="range" min="1" max="100" value="${d.brightness ?? 0}" style="--v:${d.brightness ?? 0}%" data-act="bright" ${online ? "" : "disabled"} aria-label="Brightness of ${esc(d.alias)}">` : ""}
    ${chips ? `<div class="chips">${chips}</div>` : ""}
    ${d.error ? `<div class="err">${esc(d.error)}</div>` : ""}
  </div>`;
}

function render() {
  if (dragging) return;
  const root = $("#devices");
  if (!devices.length) { root.innerHTML = `<div class="empty">Looking for devices… discovery can take a few seconds.</div>`; return; }
  const hubs = devices.filter((d) => d.children && d.children.length);
  const rest = devices.filter((d) => !(d.children && d.children.length));
  const onCount = (list) => list.filter((d) => d.on).length;
  let html = "";
  if (rest.length) html += `<h2>Lights &amp; plugs <span class="count">${onCount(rest)} of ${rest.length} on</span></h2>
    <div class="grid">${rest.map((d) => tile(d)).join("")}</div>`;
  for (const h of hubs) {
    html += `<h2>${esc(h.alias)} <span class="count">${h.children.length} paired</span></h2>
      <div class="hub">
        <div class="top"><div class="row" style="display:flex;gap:10px;align-items:center;min-width:0">
          <span class="ico">${ICONS.hub}</span>
          <div style="min-width:0"><div class="name">${esc(h.model)}</div><div class="meta">${esc(h.host)} · ${h.online ? "online" : "offline"}</div></div></div>
        </div>
        ${h.error ? `<div class="err" style="margin-bottom:8px">${esc(h.error)}</div>` : ""}
        <div class="grid">${h.children.map((c) => tile(c, h.online)).join("")}</div>
      </div>`;
  }
  root.innerHTML = html;
}

function findDevice(id) {
  for (const d of devices) {
    if (d.id === id) return d;
    for (const c of d.children || []) if (c.id === id) return c;
  }
}
$("#devices").addEventListener("click", async (ev) => {
  if (ev.target.closest('input')) return;
  const el = ev.target.closest('[data-act="toggle"]');
  if (!el || el.disabled) return;
  const id = el.closest(".tile").dataset.id;
  const d = findDevice(id);
  if (d) { d.on = !d.on; render(); }  // optimistic
  try { await api(`/api/devices/${encodeURIComponent(id)}/toggle`); }
  catch (e) { if (d) { d.on = !d.on; render(); } toast(e.message); }
});
$("#devices").addEventListener("input", (ev) => {
  if (ev.target.dataset.act !== "bright") return;
  dragging = ev.target.closest(".tile").dataset.id;
  ev.target.style.setProperty("--v", `${ev.target.value}%`);
});
$("#devices").addEventListener("change", async (ev) => {
  if (ev.target.dataset.act !== "bright") return;
  const id = ev.target.closest(".tile").dataset.id;
  dragging = null;
  try { await api(`/api/devices/${encodeURIComponent(id)}/brightness`, { value: +ev.target.value }); }
  catch (e) { toast(e.message); render(); }
});

function onEvent(e) {
  lastEvent[e.device_id] = e;
  render();
  const el = document.querySelector(`[data-id="${CSS.escape(e.device_id)}"]`);
  if (el) { el.classList.add("glow"); setTimeout(() => el.classList.remove("glow"), 1500); }
}

// ---------------------------------------------------------------- appliances: SmartThings laundry
let appliances = [];
let tuyaDevices = [];
function updateApplianceSection() {
  const show = appliances.length || tuyaDevices.length || !$("#apperr").hidden || !$("#stconnect").hidden;
  $("#appliances").hidden = !show;
}
const minutesLeft = (a) => a.ends_at ? Math.max(0, Math.round((new Date(a.ends_at) - Date.now()) / 60000)) : a.remaining_min;

function renderAppliances(msg) {
  if (msg) {
    appliances = msg.appliances || [];
    const auth = msg.auth || {};
    const needsLogin = auth.mode === "oauth" && !auth.connected;
    $("#stconnect").hidden = !needsLogin;
    $("#apperr").hidden = !msg.error || needsLogin;
    $("#apperr").textContent = msg.error ? `SmartThings: ${msg.error}` : "";
    $("#appauth").textContent = auth.mode === "pat" ? "SmartThings 24 h token" : "";
  }
  updateApplianceSection();
  $("#stcards").innerHTML = appliances.map((a) => {
    const running = a.machine_state === "run", paused = a.machine_state === "pause";
    const left = minutesLeft(a);
    const chips = [
      a.power_w != null ? `<span class="chip">Power <b>${esc(a.power_w)} W</b></span>` : "",
      a.remote_control != null ? `<span class="chip">Remote <b>${a.remote_control === "true" || a.remote_control === true ? "on" : "off"}</b></span>` : "",
    ].join("");
    return `
    <div class="tile appl ${running ? "running" : paused ? "paused" : ""} ${a.online === false ? "offline" : ""}" data-id="${esc(a.id)}">
      <div class="top"><span class="ico">${a.kind === "washer" ? ICONS.washer : ICONS.dryer}</span><span class="state">${esc(a.status || "?")}</span></div>
      <div style="min-width:0"><div class="name">${esc(a.name)}</div>
        <div class="meta">${a.kind === "washer" ? "Washer" : "Dryer"}${running || paused ? ` · ${esc(a.phase || "")}` : ""}</div></div>
      ${running || paused ? `
        <div><div class="big">${left != null ? `${left} min` : "–"}</div>
          <div class="meta">${a.ends_at ? `done around ${hhmm(a.ends_at)}` : "&nbsp;"}</div></div>
        ${a.progress != null ? `<div class="bar"><i style="width:${Math.min(100, +a.progress)}%"></i></div>` : ""}` : ""}
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      ${a.error ? `<div class="err">${esc(a.error)}</div>` : ""}
    </div>`;
  }).join("");
}
setInterval(() => appliances.length && renderAppliances(), 30000);  // keep countdowns fresh between polls

$("#stlogin").onclick = async () => {
  try { const r = await (await fetch("/api/smartthings/auth-url")).json(); window.open(r.url, "_blank", "noopener"); }
  catch { toast("Could not get the login link"); }
};
$("#stsubmit").onclick = async () => {
  const code = $("#stcode").value.trim();
  if (!code) return toast("Paste the address first");
  try { await api("/api/smartthings/connect", { code }); $("#stcode").value = ""; toast("SmartThings connected"); }
  catch (e) { toast(e.message); }
};

// ---------------------------------------------------------------- appliances: Tuya heater
let tuyaBusy = false;
const fmtKW = (w) => w == null ? "–" : w >= 1000 ? `${(w / 1000).toFixed(2)} kW` : `${Math.round(w)} W`;
const money = (v, cur) => v == null ? "" : ` · ${cur}${v.toFixed(2)}`;

function renderTuya(list) {
  if (list) tuyaDevices = list;
  updateApplianceSection();
  $("#tuyacards").innerHTML = tuyaDevices.map((t) => {
    const cls = t.status === "Heating" ? "running" : t.status === "Hot" ? "ready" : "";
    const boostMin = t.boost_ends_at ? Math.max(0, Math.ceil((new Date(t.boost_ends_at) - Date.now()) / 60000)) : null;
    const elec = t.on && t.online
      ? [t.current_a != null ? `${t.current_a} A` : "", t.voltage_v ? `${Math.round(t.voltage_v)} V` : ""].filter(Boolean).join(" · ") : "";
    return `
    <div class="tile appl wide ${cls} ${t.on ? "on" : ""} ${t.online ? "" : "offline"}" data-id="${esc(t.id)}">
      <div class="top">
        <span class="ico">${ICONS.heater}</span>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="state">${esc(t.status === "Hot" ? "Hot water ready" : t.status)}</span>
          <button class="switch ${t.on ? "on" : ""}" data-tuya="toggle" aria-label="Toggle ${esc(t.name)}" ${t.online ? "" : "disabled"}></button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
        <div style="min-width:0"><div class="name">${esc(t.name)}</div><div class="meta">Immersion heater${elec ? ` · ${esc(elec)}` : ""}</div></div>
        <div style="text-align:right"><div class="big">${t.on ? fmtKW(t.power_w) : "Off"}</div>
          <div class="meta">${boostMin != null ? `Boost · ${boostMin} min left · ends ${hhmm(t.boost_ends_at)}` : t.on && t.on_since ? `on since ${hhmm(t.on_since)}` : "&nbsp;"}</div></div>
      </div>
      ${t.has_boost ? `<div class="boosts">
        ${[30, 60, 90].map((m) => `<button class="btn" data-tuya="boost" data-min="${m}" ${t.online ? "" : "disabled"}>Boost ${m} min</button>`).join("")}
        ${boostMin != null ? `<button class="btn" data-tuya="boost" data-min="0">Cancel timer</button>` : ""}
      </div>` : ""}
      <div class="chips">
        <span class="chip">Today <b>${t.kwh_today.toFixed(2)} kWh${money(t.cost_today, t.currency)}</b></span>
        <span class="chip">7 days <b>${t.kwh_7d.toFixed(2)} kWh${money(t.cost_7d, t.currency)}</b></span>
        ${t.max_on_minutes ? `<span class="chip">Auto-off <b>${t.max_on_minutes} min</b></span>` : ""}
        ${t.faults.map((f) => `<span class="chip bad">Fault <b>${esc(f)}</b></span>`).join("")}
      </div>
      ${t.energy_error ? `<div class="err">Energy history: ${esc(t.energy_error)}</div>` : ""}
      ${t.error && !t.online ? `<div class="err">${esc(t.error)}</div>` : ""}
    </div>`;
  }).join("");
}
setInterval(() => tuyaDevices.some((t) => t.boost_ends_at) && renderTuya(), 30000);

$("#tuyacards").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("[data-tuya]");
  if (!btn || tuyaBusy) return;
  const id = btn.closest(".tile").dataset.id;
  tuyaBusy = true;
  try {
    if (btn.dataset.tuya === "toggle") await api(`/api/tuya/${encodeURIComponent(id)}/state`, {});
    else {
      const m = +btn.dataset.min;
      await api(`/api/tuya/${encodeURIComponent(id)}/boost`, { minutes: m });
      toast(m ? `Boost on for ${m} min` : "Timer cancelled");
    }
  } catch (e) { toast(e.message); }
  finally { tuyaBusy = false; }
});

// ---------------------------------------------------------------- header actions
$("#alloff").onclick = async () => {
  try { const r = await api("/api/scenes/all-off"); toast(`Switched off ${r.switched_off} device(s)`); }
  catch (e) { toast(e.message); }
};
$("#rediscover").onclick = async () => {
  toast("Searching the network…");
  try { const r = await api("/api/discover"); toast(`${r.devices} device(s) found`); }
  catch (e) { toast(e.message); }
};

// ---------------------------------------------------------------- live updates
function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  let ping;
  ws.onopen = () => {
    $("#dot").classList.add("live"); $("#status").textContent = "Live";
    ping = setInterval(() => ws.readyState === 1 && ws.send("ping"), 25000);
  };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "devices") { devices = msg.devices; render(); }
    else if (msg.type === "events") { for (const e of [...msg.events].reverse()) lastEvent[e.device_id] = e; render(); }
    else if (msg.type === "event") onEvent(msg.event);
    else if (msg.type === "appliances") renderAppliances(msg);
    else if (msg.type === "tuya") renderTuya(msg.devices);
  };
  ws.onclose = () => {
    clearInterval(ping);
    $("#dot").classList.remove("live"); $("#status").textContent = "Reconnecting…";
    setTimeout(connect, 2000);
  };
}
connect();

// ---------------------------------------------------------------- cameras
// Each snapshot reloads only after the previous one arrived, so a slow camera never piles up requests.
let camRefresh = 2, camLive = false;
const viewer = { id: null };
const snapURL = (id, res) => `/api/cameras/${encodeURIComponent(id)}/snapshot?res=${res}&t=${Date.now()}`;

function pump(img, id, res, onState, isActive) {
  const next = () => setTimeout(tick, camRefresh * 1000);
  function tick() {
    if (!isActive()) return;
    if (document.hidden) return next();
    const pre = new Image();
    pre.onload = () => { img.src = pre.src; onState(true); next(); };
    pre.onerror = () => { onState(false); setTimeout(tick, Math.max(camRefresh, 5) * 1000); };
    pre.src = snapURL(id, res);
  }
  tick();
}

async function loadCameras() {
  let data;
  try { data = await (await fetch("/api/cameras")).json(); } catch { return; }
  camRefresh = data.refresh_seconds || 2;
  camLive = !!data.live;
  if (!data.cameras.length) return;
  $("#cameras").hidden = false;
  $("#camgrid").innerHTML = data.cameras.map((c) => `
    <div class="cam" data-cam="${esc(c.id)}" role="button" tabindex="0" aria-label="Open live view of ${esc(c.name)}">
      <img alt="">
      <div class="msg">Loading…</div>
      <span class="pill"><span class="dot"></span><span class="bt">connecting</span></span>
      <div class="over"><span class="name">${esc(c.name)}</span><span class="play">${camLive ? "▶ Live" : "Enlarge"}</span></div>
    </div>`).join("");
  for (const c of data.cameras) {
    const el = document.querySelector(`.cam[data-cam="${CSS.escape(c.id)}"]`);
    let lastOk = null;
    pump(el.querySelector("img"), c.id, "low", (ok) => {
      if (ok) lastOk = new Date();
      el.querySelector(".msg").hidden = ok || !!lastOk;
      if (!ok && !lastOk) el.querySelector(".msg").textContent = "Camera not reachable";
      el.querySelector(".dot").classList.toggle("live", ok);
      el.querySelector(".bt").textContent = ok ? "snapshot" : lastOk ? `stale · ${hhmm(lastOk)}` : "offline";
    }, () => true);
    el.onclick = () => openViewer(c);
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openViewer(c); } };
  }
}

// live viewer: show the latest snapshot instantly, swap to MJPEG once its first frame arrives,
// fall back to HD snapshots if live isn't available.
function setViewerState(text, live) { $("#vstate").textContent = text; $("#vbadge .dot").classList.toggle("live", !!live); }
function stopLive() {
  const live = $("#viewerlive");
  live.onerror = null;
  live.removeAttribute("src");  // aborts the MJPEG request so the server can stop ffmpeg
  live.hidden = true;
  clearInterval(viewer.watch);
}
function openViewer(c, quality = "hd") {
  stopLive();
  const token = (viewer.id = {});
  viewer.cam = c;
  const active = () => viewer.id === token;
  const snap = $("#viewersnap"), live = $("#viewerlive"), note = $("#vnote");
  $("#viewercap").textContent = c.name;
  document.querySelectorAll(".vbtn[data-q]").forEach((b) => { b.classList.toggle("active", b.dataset.q === quality); b.hidden = !camLive; });
  snap.src = document.querySelector(`.cam[data-cam="${CSS.escape(c.id)}"] img`).src || "";
  const rtsp = `RTSP for VLC: <code>${esc(quality === "sd" ? c.rtsp.low : c.rtsp.high)}</code>`;
  note.innerHTML = rtsp;
  $("#viewer").hidden = false;

  const fallback = (why) => {
    if (!active()) return;
    stopLive();
    note.innerHTML = `${esc(why)}<br>${rtsp}`;
    pump(snap, c.id, "high", (ok) => active() && setViewerState(ok ? "snapshots" : "offline", ok), active);
  };
  if (!camLive) return fallback("Live video needs ffmpeg on the dashboard machine (brew install ffmpeg). Showing snapshots.");

  setViewerState("connecting…", false);
  live.onerror = () => fallback("Live stream unavailable; check that RTSP is enabled on the camera. Showing snapshots.");
  live.src = `/api/cameras/${encodeURIComponent(c.id)}/live?q=${quality}&t=${Date.now()}`;
  const started = Date.now();
  viewer.watch = setInterval(() => {  // multipart <img> has no reliable load event: poll for the first frame
    if (!active()) return clearInterval(viewer.watch);
    if (live.naturalWidth > 0) { clearInterval(viewer.watch); live.hidden = false; setViewerState(`live · ${quality.toUpperCase()}`, true); }
    else if (Date.now() - started > 20000) fallback("Live stream didn't start within 20 s. Showing snapshots.");
  }, 250);
}
function closeViewer() {
  if ($("#viewer").hidden) return;
  stopLive(); viewer.id = null; $("#viewer").hidden = true;
}
$("#viewer").addEventListener("click", (e) => { if (e.target.id === "viewer") closeViewer(); });
$("#vclose").onclick = closeViewer;
document.querySelectorAll(".vbtn[data-q]").forEach((b) => (b.onclick = () => openViewer(viewer.cam, b.dataset.q)));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeViewer(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) closeViewer(); });  // frees ffmpeg

loadCameras();
</script>
</body>
